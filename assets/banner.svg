<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c1024" />
      <stop offset="100%" stop-color="#140b29" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .orbit-1 {
      animation: rotateRing 20s linear infinite;
      transform-origin: 1040px 200px;
    }
    .orbit-2 {
      animation: rotateRingRev 14s linear infinite;
      transform-origin: 1040px 200px;
    }
    .float-particle {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .grid-pulse {
      animation: gridDrift 8s ease-in-out infinite alternate;
    }
    .reticle-spin {
      animation: rotateRing 12s linear infinite;
      transform-origin: 160px 200px;
    }
    .hud-scan {
      animation: scanBeam 6s ease-in-out infinite alternate;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateRingRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.85; transform: scale(1.05); }
    }
    @keyframes gridDrift {
      0% { transform: translateY(0px); opacity: 0.2; }
      100% { transform: translateY(-8px); opacity: 0.35; }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(180px); opacity: 0.2; }
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <g class="float-particle">
    <circle cx="200" cy="100" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="240" r="190" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
    <circle cx="620" cy="350" r="130" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- AR Spatial Perspective Grid Lines (Background decoration) -->
  <g class="grid-pulse" stroke="url(#gridGrad)" stroke-width="1.2">
    <!-- Perspective horizontal lines -->
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="345" x2="1200" y2="345" />
    <line x1="0" y1="370" x2="1200" y2="370" />
    <line x1="0" y1="390" x2="1200" y2="390" />
    <!-- Radiating vanishing perspective lines -->
    <line x1="600" y1="250" x2="0" y2="390" />
    <line x1="600" y1="250" x2="200" y2="400" />
    <line x1="600" y1="250" x2="400" y2="400" />
    <line x1="600" y1="250" x2="600" y2="400" />
    <line x1="600" y1="250" x2="800" y2="400" />
    <line x1="600" y1="250" x2="1000" y2="400" />
    <line x1="600" y1="250" x2="1200" y2="390" />
  </g>

  <!-- Left Dynamic AR Reticle Target (HUD Widget) -->
  <g class="reticle-spin" opacity="0.45">
    <circle cx="160" cy="200" r="75" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />
    <circle cx="160" cy="200" r="50" stroke="#818cf8" stroke-width="1" stroke-dasharray="16 10" fill="none" />
    <line x1="160" y1="115" x2="160" y2="135" stroke="#38bdf8" stroke-width="2" />
    <line x1="160" y1="265" x2="160" y2="285" stroke="#38bdf8" stroke-width="2" />
    <line x1="75" y1="200" x2="95" y2="200" stroke="#38bdf8" stroke-width="2" />
    <line x1="225" y1="200" x2="245" y2="200" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Right Dynamic AR Spatial Gyroscope / Hologram Target -->
  <g opacity="0.6">
    <g class="orbit-1">
      <ellipse cx="1040" cy="200" rx="90" ry="35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 5" fill="none" />
      <circle cx="1130" cy="200" r="4.5" fill="#38bdf8" filter="url(#softGlow)" />
    </g>
    <g class="orbit-2">
      <ellipse cx="1040" cy="200" rx="90" ry="35" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="14 7" fill="none" />
      <circle cx="950" cy="200" r="4.5" fill="#c084fc" filter="url(#softGlow)" />
    </g>
    <!-- Center Anchor Cube / Crosshair -->
    <polygon points="1040,180 1060,190 1060,212 1040,222 1020,212 1020,190" stroke="#a855f7" stroke-width="1.5" fill="#a855f7" fill-opacity="0.18" />
  </g>

  <!-- Subtle Scanning Laser Line (Behind Text) -->
  <line class="hud-scan" x1="100" y1="110" x2="1100" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="25 15" />

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Eyebrow Pill -->
  <g transform="translate(600, 75)">
    <rect x="-195" y="-17" width="390" height="34" rx="17" fill="url(#cyanPill)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="2">AUGMENTED REALITY &amp; CLI TOOLS ECOSYSTEM</text>
  </g>

  <!-- Main Title (Centered Foreground) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Segoe UI Emoji', sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="-1">
    Awesome Augmented Reality
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.5">
    Curated Hub of WebXR Frameworks, Image Tracking SDKs, Spatial Viewers &amp; AR Tooling
  </text>

  <!-- Interactive Feature Pills Row in Foreground -->
  <g transform="translate(600, 268)">
    <!-- Pill 1: WebXR & SLAM -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🌐 WebXR &amp; SLAM</text>
    </g>
    <!-- Pill 2: Open-Source SDKs -->
    <g transform="translate(-160, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">⚡ Open-Source SDKs</text>
    </g>
    <!-- Pill 3: Image & Face Tracking -->
    <g transform="translate(10, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">🎯 Image &amp; Face Tracking</text>
    </g>
    <!-- Pill 4: 3D Model Viewers -->
    <g transform="translate(180, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#f472b6">📦 3D Model Viewers</text>
    </g>
    <!-- Pill 5: Enterprise SaaS -->
    <g transform="translate(330, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">🚀 AR SaaS Tools</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#titleGrad)" />
</svg>