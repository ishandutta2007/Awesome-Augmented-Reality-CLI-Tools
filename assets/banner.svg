<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0c1024"/><stop offset="100%" stop-color="#140b29"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".05"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanPill" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".6"/><stop offset="100%" stop-color="#06b6d4" stop-opacity=".2"/></linearGradient><linearGradient id="purplePill" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".6"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="14"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes rotateRing{0%{transform:rotate(0deg)}}@keyframes rotateRingRev{0%{transform:rotate(360deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(.96)}}@keyframes gridDrift{0%{transform:translateY(0);opacity:.2}}@keyframes scanBeam{0%{transform:translateY(0);opacity:.2}50%{opacity:.6}}.orbit-1,.orbit-2{animation:rotateRing 20s linear infinite;transform-origin:1040px 200px}.orbit-2{animation:rotateRingRev 14s linear infinite}.float-particle{animation:pulseGlow 4s ease-in-out infinite alternate}.grid-pulse{animation:gridDrift 8s ease-in-out infinite alternate}.reticle-spin{animation:rotateRing 12s linear infinite;transform-origin:160px 200px}.hud-scan{animation:scanBeam 6s ease-in-out infinite alternate}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><g class="float-particle"><circle cx="200" cy="100" r="160" fill="#38bdf8" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="240" r="190" fill="#a855f7" filter="url(#glow)" opacity=".15"/><circle cx="620" cy="350" r="130" fill="#06b6d4" filter="url(#glow)" opacity=".08"/></g><g stroke="url(#gridGrad)" stroke-width="1.2" class="grid-pulse"><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="315" y2="315"/><line x1="0" x2="1200" y1="345" y2="345"/><line x1="0" x2="1200" y1="370" y2="370"/><line x1="0" x2="1200" y1="390" y2="390"/><line x1="600" x2="0" y1="250" y2="390"/><line x1="600" x2="200" y1="250" y2="400"/><line x1="600" x2="400" y1="250" y2="400"/><line x1="600" x2="600" y1="250" y2="400"/><line x1="600" x2="800" y1="250" y2="400"/><line x1="600" x2="1000" y1="250" y2="400"/><line x1="600" x2="1200" y1="250" y2="390"/></g><g class="reticle-spin" opacity=".45"><circle cx="160" cy="200" r="75" fill="none" stroke="#38bdf8" stroke-dasharray="8 6" stroke-width="1.5"/><circle cx="160" cy="200" r="50" fill="none" stroke="#818cf8" stroke-dasharray="16 10" stroke-width="1"/><line x1="160" x2="160" y1="115" y2="135" stroke="#38bdf8" stroke-width="2"/><line x1="160" x2="160" y1="265" y2="285" stroke="#38bdf8" stroke-width="2"/><line x1="75" x2="95" y1="200" y2="200" stroke="#38bdf8" stroke-width="2"/><line x1="225" x2="245" y1="200" y2="200" stroke="#38bdf8" stroke-width="2"/></g><g opacity=".6"><g class="orbit-1"><ellipse cx="1040" cy="200" fill="none" stroke="#38bdf8" stroke-dasharray="10 5" stroke-width="1.5" rx="90" ry="35"/><circle cx="1130" cy="200" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/></g><g class="orbit-2"><ellipse cx="1040" cy="200" fil